<div class="content-column">
  <section class="page-header">
    <div>
      <p class="eyebrow">People</p>
      <h1>Tenants</h1>
      <p class="subtitle">See who occupies each unit and keep their info handy.</p>
    </div>
    <button mat-flat-button color="primary" type="button" routerLink="/tenant/create">
      <mat-icon>group_add</mat-icon>
      Invite Tenant
    </button>
  </section>

  <mat-card class="page-panel">
    <mat-divider class="panel-divider"></mat-divider>

    <div class="table-wrapper" *ngIf="tenants.length; else emptyState">
      <table mat-table [dataSource]="tenants" class="entity-table">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Tenant</th>
          <td mat-cell *matCellDef="let tenant">
            <span class="primary-text">Tenant #{{ tenant.id ?? '—' }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let tenant">
            <span class="primary-text">{{ tenant.name }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-cell">Actions</th>
          <td mat-cell *matCellDef="let tenant" class="actions-cell">
            <button
              mat-icon-button
              color="primary"
              [routerLink]="['/tenant', tenant.id, 'edit']"
              [disabled]="!tenant.id"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="loading-state" *ngIf="loading">
      <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>
    <p class="error" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>
  </mat-card>
</div>

<ng-template #emptyState>
  <ng-container *ngIf="!loading; else loadingBlock">
    <div class="empty-state">
      <mat-icon>group_off</mat-icon>
      <p>No tenants in the system yet.</p>
      <button mat-stroked-button color="primary" type="button" routerLink="/tenant/create">Add Tenant</button>
    </div>
  </ng-container>
</ng-template>

<ng-template #loadingBlock>
  <div class="empty-state">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    <p>Loading tenants…</p>
  </div>
</ng-template>
