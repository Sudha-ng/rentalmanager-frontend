<div class="content-column">
  <section class="page-header">
    <div>
      <p class="eyebrow">Revenue</p>
      <h1>Edit Income Entry</h1>
      <p class="subtitle">Adjust recorded payments to keep the ledger precise.</p>
    </div>
    <button mat-stroked-button color="primary" routerLink="/income">Back to list</button>
  </section>

  <mat-card class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="entity-form" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Amount (INR)</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="salary" />
      </mat-form-field>

      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancel()" [disabled]="submitting">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
          <mat-icon>save</mat-icon>
          Update income
        </button>
      </div>
    </form>

    <div class="form-overlay" *ngIf="loadingIncome || submitting">
      <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
    </div>
  </mat-card>
</div>
