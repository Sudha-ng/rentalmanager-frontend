<div class="content-column">
  <section class="page-header">
    <div>
      <p class="eyebrow">Portfolio</p>
      <h1>Edit Property</h1>
      <p class="subtitle">Keep property records up to date for every stakeholder.</p>
    </div>
    <button mat-stroked-button color="primary" routerLink="/property">Back to list</button>
  </section>

  <mat-card class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="entity-form" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>User ID</mat-label>
        <input matInput type="number" min="1" formControlName="userId" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address line 1</mat-label>
        <input matInput formControlName="addressLine1" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address line 2</mat-label>
        <input matInput formControlName="addressLine2" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>State / Province</mat-label>
        <input matInput formControlName="stateProvince" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Postal code</mat-label>
        <input matInput formControlName="zipPostalCode" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Purchase price (INR)</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="purchasePrice" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Market value (INR)</mat-label>
        <input matInput type="number" min="0" step="0.01" formControlName="currentMarketValue" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancel()" [disabled]="submitting">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
          <mat-icon>save</mat-icon>
          Update property
        </button>
      </div>
    </form>

    <div class="form-overlay" *ngIf="loadingProperty || submitting">
      <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
    </div>
  </mat-card>
</div>
