<section class="page-header">
  <div>
    <p class="eyebrow">Adjust Category</p>
    <h1>Edit Expense Type</h1>
    <p class="subtitle">Keep naming consistent across the portfolio.</p>
  </div>
  <button mat-stroked-button color="primary" routerLink="/expense-types">Back to list</button>
</section>

<mat-card>
  <form class="type-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="typeName" />
      <mat-error *ngIf="form.controls.typeName.hasError('required')">Name is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>

    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()" [disabled]="submitting">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting">
        <mat-icon>save</mat-icon>
        Update Type
      </button>
    </div>
  </form>

  <div class="loading-overlay" *ngIf="loading || submitting">
    <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
  </div>
</mat-card>
