<div class="content-column">
  <section class="page-header">
    <div>
      <p class="eyebrow">Safety</p>
      <h1>Emergency Contacts</h1>
      <p class="subtitle">Keep the first call list current for every tenant.</p>
    </div>
    <button mat-flat-button color="primary" type="button" routerLink="/emergency-contact/create">
      <mat-icon>contact_phone</mat-icon>
      Add Contact
    </button>
  </section>

  <mat-card class="page-panel">
    <mat-divider class="panel-divider"></mat-divider>

    <div class="table-wrapper" *ngIf="contacts.length; else emptyState">
      <table mat-table [dataSource]="contacts" class="entity-table">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Record</th>
          <td mat-cell *matCellDef="let contact">
            <span class="primary-text">Contact #{{ contact.id ?? '—' }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let contact">
            <span class="primary-text">{{ contact.phone }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-cell">Actions</th>
          <td mat-cell *matCellDef="let contact" class="actions-cell">
            <button
              mat-icon-button
              color="primary"
              [routerLink]="['/emergency-contact', contact.id, 'edit']"
              [disabled]="!contact.id"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="loading-state" *ngIf="loading">
      <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>
    <p class="error" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>
  </mat-card>
</div>

<ng-template #emptyState>
  <ng-container *ngIf="!loading; else loadingBlock">
    <div class="empty-state">
      <mat-icon>contact_mail</mat-icon>
      <p>No emergency contacts defined.</p>
      <button mat-stroked-button color="primary" type="button" routerLink="/emergency-contact/create">Add Contact</button>
    </div>
  </ng-container>
</ng-template>

<ng-template #loadingBlock>
  <div class="empty-state">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    <p>Loading contacts…</p>
  </div>
</ng-template>
