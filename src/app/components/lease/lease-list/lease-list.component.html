<div class="content-column">
  <section class="page-header">
    <div>
      <p class="eyebrow">Contracts</p>
      <h1>Leases</h1>
      <p class="subtitle">Monitor lease lengths, tenants, and renewal windows.</p>
    </div>
    <button mat-flat-button color="primary" type="button" routerLink="/lease/create">
      <mat-icon>description</mat-icon>
      New Lease
    </button>
  </section>

  <mat-card class="page-panel">
    <mat-divider class="panel-divider"></mat-divider>

    <div class="table-wrapper" *ngIf="leases.length; else emptyState">
      <table mat-table [dataSource]="leases" class="entity-table">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Lease</th>
          <td mat-cell *matCellDef="let lease">
            <span class="primary-text">Lease #{{ lease.id ?? '—' }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="term">
          <th mat-header-cell *matHeaderCellDef>Term</th>
          <td mat-cell *matCellDef="let lease">
            <span class="primary-text">{{ lease.leaseMonths }} months</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-cell">Actions</th>
          <td mat-cell *matCellDef="let lease" class="actions-cell">
            <button
              mat-icon-button
              color="primary"
              [routerLink]="['/lease', lease.id, 'edit']"
              [disabled]="!lease.id"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="loading-state" *ngIf="loading">
      <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>
    <p class="error" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>
  </mat-card>
</div>

<ng-template #emptyState>
  <ng-container *ngIf="!loading; else loadingBlock">
    <div class="empty-state">
      <mat-icon>event_busy</mat-icon>
      <p>No leases have been created yet.</p>
      <button mat-stroked-button color="primary" type="button" routerLink="/lease/create">Draft Lease</button>
    </div>
  </ng-container>
</ng-template>

<ng-template #loadingBlock>
  <div class="empty-state">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    <p>Loading leases…</p>
  </div>
</ng-template>
