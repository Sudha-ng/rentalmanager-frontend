<mat-toolbar color="primary" class="app-toolbar" role="navigation">
  <button mat-icon-button class="brand-icon" aria-label="RentalManager home" routerLink="/">
  </button>
  <div class="brand">
    <span class="brand-title">RentalManager</span>
  </div>

  <span class="spacer"></span>
</mat-toolbar>

<nav class="tab-nav" role="tablist">
  <a
    class="tab-link"
    routerLink="/expenses"
    routerLinkActive="active-tab"
    #expensesTab="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    role="tab"
    [attr.aria-selected]="expensesTab.isActive"
  >
    Expenses
  </a>
  <a
    class="tab-link"
    routerLink="/expense-types"
    routerLinkActive="active-tab"
    #expenseTypesTab="routerLinkActive"
    role="tab"
    [attr.aria-selected]="expenseTypesTab.isActive"
  >
    Expense Types
  </a>
</nav>

<main class="app-shell">
  <router-outlet></router-outlet>
</main>
